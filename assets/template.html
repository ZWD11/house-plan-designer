<div class="app">

  <button class="btn" id="undoBtn" title="撤销 (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="btn" id="redoBtn" title="重做 (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <button class="btn" id="quoteBtn" title="算量报价"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>报价</button>
  <button class="btn" id="saveBtn" title="保存到本地 (Ctrl+S)"><svg class="i" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7M8 21v-7h8v7"/></svg>保存</button>
  <div class="menu" id="exportMenu">
    <button class="btn primary"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></svg>导出图纸 ▾</button>
    <div class="dropdown">
      <button data-exp="pdf"><b>整套施工图（A3 PDF）</b></button>
      <button data-exp="share"><b>分享文件</b>（发给别人查看、留言、确认）</button>
      <button data-exp="original">原始结构图</button>
      <button data-exp="demolition">拆改图（新砌 / 拆除）</button>
      <button data-exp="layout">平面布置图</button>
      <button data-exp="floor">地面铺装图</button>
      <button data-exp="ceiling">顶面布置图</button>
      <button data-exp="mep">水电点位图</button>
      <button data-exp="3d">当前 3D 画面</button>
    </div>
  </div>
  <button class="iconbtn mobile-only" id="rightToggle" title="属性">ⓘ</button>
  <div class="menu" id="moreMenu">
    <button class="btn" title="更多">⋯</button>
    <div class="dropdown">
      <button data-act="exportJson">导出方案文件 (.json)</button>
      <button data-act="importJson">导入方案文件…</button>
      <button data-act="clearMeasure">清除全部测量</button>
      <button data-act="restoreWalls">恢复所有拆除的墙</button>
    </div>
  </div>
</header>
<main>
  <aside id="leftPanel"></aside>
  <section class="stage" id="stage" data-view="2d">
    <div class="pane" id="pane2d">
      <canvas id="c2d" tabindex="0"></canvas>
      <input id="dimInput" type="number" step="10">
      <div class="overlay ov-br">
        <button class="iconbtn" id="zoomOut" title="缩小">－</button>
        <button class="iconbtn" id="zoomIn" title="放大">＋</button>
        <button class="iconbtn" id="fitBtn" title="适应窗口 (F)"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="overlay ov-tl"><div class="glass chip" id="toolHint"></div></div>
      <div class="overlay ov-tr"><div class="seg glass" id="layerSeg">
        <button data-layer="layout" class="on" title="F5">布置</button><button data-layer="mep" title="F6">水电</button><button data-layer="ceiling" title="F7">顶面</button><button data-layer="floor" title="F8">铺装</button><button data-layer="demolition" title="F9">拆改</button>
      </div></div>
    </div>
    <div class="pane" id="pane3d">
      <canvas id="c3d" tabindex="0"></canvas>
      <div class="loading3d" id="loading3d">正在准备 3D 场景…</div>
      <div class="overlay ov-tl">
        <div class="seg glass" id="camSeg">
          <button data-cam="bird" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>鸟瞰</button>
          <button data-cam="fp"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v6l-3 8M12 13l3 8M8 10h8"/></svg>漫游</button>
        </div>
        <button class="iconbtn" id="lightBtn" title="光照：时间、朝向、开灯">☀</button>
        <button class="btn glass" id="renderBtn" title="高清渲染出图">渲染出图</button>
        <button class="btn glass" id="panoBtn" title="在漫游位置生成 720° 全景图">720° 全景</button>
        <button class="iconbtn" id="camReset" title="重置视角"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg></button>
      </div>
      <div class="glass pop" id="lightPop">
        <div class="poprow"><span>时间</span><input type="range" id="timeIn" min="6" max="21" step="0.25" value="15"><b id="timeOut">15:00</b></div>
        <div class="poprow"><span>指北</span><input type="range" id="northIn" min="-180" max="180" step="5" value="0"><b id="northOut">0°</b></div>
        <label class="row"><input type="checkbox" id="lampIn"> 打开室内灯光（夜晚自动打开）</label>
        <div class="poprow"><span>出图</span><select id="resIn"><option value="1920x1080">1920×1080</option><option value="2560x1440" selected>2560×1440</option><option value="3840x2160">3840×2160（4K）</option></select></div>
      </div>
      <div class="joy" id="joy"><i></i></div>
      <div class="crosshair" id="crosshair"></div>
      <div class="fphint" id="fphint">W A S D 移动 · 按住鼠标拖动转向 · Shift 加速 · Esc 退出漫游</div>
    </div>
  </section>
  <aside class="right" id="inspector"></aside>
</main>
<footer>
  <span id="stCoord">X — · Y —</span>
  <span id="stZoom">缩放 100%</span>
  <span id="stArea"></span>
  <span class="grow"></span>
  <span id="stSave">未保存</span>
</footer>
</div>
<div id="toast"></div>
<div id="shareBanner"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
</body>
</html>
