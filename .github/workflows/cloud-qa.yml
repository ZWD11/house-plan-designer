name: Designer script checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [apartment, villa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: git ls-files -z '*.mjs' | xargs -0 -n 1 node --check
      - name: Install build dependency
        run: python -m pip install pillow
      - name: Build example
        run: |
          mkdir -p qa-output
          if [ "${{ matrix.example }}" = villa ]; then
            python reference/example-gen-villa.py qa-output/spec.json
          else
            cp reference/example-spec.json qa-output/spec.json
          fi
          python scripts/build.py qa-output/spec.json -o qa-output/designer.html --no-underlay
      - name: Upload generated example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designer-qa-${{ matrix.example }}
          path: qa-output/
          retention-days: 14
